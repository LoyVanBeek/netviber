[project]
name = "netviber"
version = "1.0.0"
description = "A Netvibes-style RSS dashboard fed by an OPML file."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "feedparser>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
netviber = "netviber.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netviber"]
