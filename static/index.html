<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Netviber</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23171c23'/><rect x='14' y='14' width='33' height='33' rx='6' fill='%232dd4bf'/><rect x='53' y='14' width='33' height='33' rx='6' fill='%232dd4bf' opacity='.55'/><rect x='14' y='53' width='33' height='33' rx='6' fill='%232dd4bf' opacity='.55'/><rect x='53' y='53' width='33' height='33' rx='6' fill='%232dd4bf' opacity='.25'/></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="topbar" hidden>
    <div class="brand"><span class="logo">▦</span> Netviber</div>
    <nav id="tabs" role="tablist" aria-label="Feed categories"></nav>
    <div class="actions">
      <select id="refresh-interval" title="Auto-refresh interval">
        <option value="0">Auto: off</option>
        <option value="5">Every 5 min</option>
        <option value="15">Every 15 min</option>
        <option value="30">Every 30 min</option>
        <option value="60">Every 60 min</option>
      </select>
      <button id="refresh-all" class="btn">↻ Refresh</button>
      <button id="import-btn" class="btn subtle">Import OPML…</button>
    </div>
  </header>

  <main>
    <section id="import-screen">
      <div class="intro">
        <h1><span class="logo big">▦</span> Netviber</h1>
        <p>Your feeds, on your own dashboard. Drop in an OPML file exported
           from any feed reader to get started.</p>
        <div id="dropzone" role="button" tabindex="0" aria-label="Choose or drop an OPML file">
          <p class="drop-main">Drop your <strong>.opml</strong> file here</p>
          <p class="drop-sub">or click to browse</p>
        </div>
      </div>
    </section>

    <section id="dashboard" hidden>
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <div id="toast" role="status" hidden></div>
  <input type="file" id="file-input" accept=".opml,.xml,text/xml,application/xml,text/x-opml" hidden />
  <script type="module" src="/app.js"></script>
</body>
</html>
